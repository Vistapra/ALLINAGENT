# =============================================================================
# ALLINAGENT — Production Low-Memory PostgreSQL 16 Configuration
# Target Profile: Shared 2-vCPU / 8-GB RAM VPS (PostgreSQL cgroup cap: 256 MiB)
# Paired With:    Paperclip Server (PAPERCLIP_LOW_MEMORY=1, <= 12-15 backends)
# Usage (Docker): postgres -c config_file=/etc/postgresql/postgresql-lowmem.conf
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Connection & Authentication Limits
# -----------------------------------------------------------------------------
# Listen on container interfaces (isolated inside internal Docker data bridge;
# override with -c listen_addresses=127.0.0.1 for native single-host mode).
listen_addresses = '*'
port = 5432

# Sized for patched Paperclip server (<= 12-15 active connections) + superuser
# maintenance/pg_dump headroom without wasting ~9-10 MB per idle backend slot.
max_connections = 35
superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# 2. Memory Budget (Fits cleanly inside 256 MiB container mem_limit)
# -----------------------------------------------------------------------------
shared_buffers = 128MB
effective_cache_size = 384MB
work_mem = 4MB
maintenance_work_mem = 32MB
temp_buffers = 4MB
huge_pages = off

# -----------------------------------------------------------------------------
# 3. CPU & Background Worker Concurrency (2-vCPU Host Protection)
# -----------------------------------------------------------------------------
max_worker_processes = 2
max_parallel_workers_per_gather = 0
max_parallel_workers = 0
max_parallel_maintenance_workers = 0

# -----------------------------------------------------------------------------
# 4. WAL, Checkpoints & NVMe/SSD Planner Tuning
# -----------------------------------------------------------------------------
wal_level = replica
max_wal_senders = 0
wal_buffers = 4MB
min_wal_size = 32MB
max_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on

# NVMe/SSD random read cost and I/O concurrency
random_page_cost = 1.1
effective_io_concurrency = 200

# -----------------------------------------------------------------------------
# 5. Autovacuum, Lock Safety & Idle Session Hygiene
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 1
autovacuum_naptime = 60s
idle_in_transaction_session_timeout = 5min
lock_timeout = 30s

# -----------------------------------------------------------------------------
# 6. Lean Production Logging & Locale Defaults
# -----------------------------------------------------------------------------
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000
log_checkpoints = off
log_connections = off
log_disconnections = off
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
