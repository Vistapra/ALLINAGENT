# ==============================================================================
# ALLINAGENT — PostgreSQL 16 Low-Memory Production Configuration
# Engineered for cgroup v2 `mem_limit: 256m` on 2-vCPU / 8-GB RAM Linux hosts.
# Target steady-state RSS: 80–120 MiB; hard ceiling < 220 MiB under 40 conns.
# ==============================================================================

# Connection & Network (Air-gapped `allinagent_data` bridge only; zero host ports)
listen_addresses = '*'
port = 5432
max_connections = 40
superuser_reserved_connections = 3

# Memory Allocation Budget (fits safely inside 256 MiB container limit)
shared_buffers = 48MB
work_mem = 2MB
maintenance_work_mem = 24MB
effective_cache_size = 128MB
temp_buffers = 4MB
huge_pages = off
dynamic_shared_memory_type = posix

# Disable LLVM JIT to prevent 50–100 MiB per-backend memory spikes
jit = off

# Write-Ahead Log (WAL) & Checkpoints
wal_level = replica
wal_buffers = 4MB
min_wal_size = 32MB
max_wal_size = 128MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
synchronous_commit = on

# Query Planner (SSD / NVMe backed storage)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Bounded Autovacuum Workers
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 60s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# Logging & Locale
logging_collector = off
log_destination = 'stderr'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 2000
log_timezone = 'UTC'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'
